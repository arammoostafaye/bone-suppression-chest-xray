# Builds the tkinter-based offline workstation from offline_package/ exactly as
# the user-supplied "BoneSuppression_Windows_Offline_Package" prescribes:
#   pyinstaller --onedir --windowed --add-data weights;weights --add-data config.json;.
#               --collect-all torch --collect-all cv2 BoneSuppression_Desktop.py
# Weights are bundled INSIDE the app dir => the result runs 100% offline.
name: build-offline-exe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (torch CPU wheel + app libs only)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel on purpose: the CUDA wheels add ~2.5 GB of unused DLLs.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "opencv-python-headless>=4.8" "numpy>=1.24" "Pillow>=10" "pydicom>=2.4" pyinstaller
          # NOTE: torchvision/gradio from the package requirements are not
          # imported by BoneSuppression_Desktop.py, so they are skipped here.

      - name: Download model weights (bundled into the app for offline use)
        run: |
          mkdir -p offline_package/weights
          curl -L --retry 3 -o offline_package/weights/bone_suppression.ts https://huggingface.co/qureaiorg/bone-suppression/resolve/main/weights/bone_suppression.ts
          curl -L --retry 3 -o offline_package/weights/lung_component_suppression.ts https://huggingface.co/qureaiorg/bone-suppression/resolve/main/weights/lung_component_suppression.ts
          curl -L --retry 3 -o offline_package/weights/fracture_yolov8.onnx https://huggingface.co/arammoostafaye/bone-suppression-desktop/resolve/main/weights/fracture_yolov8.onnx
          curl -L --retry 3 -o offline_package/weights/fracture_ortho.onnx https://huggingface.co/arammoostafaye/bone-suppression-desktop/resolve/main/weights/fracture_ortho.onnx
          curl -L --retry 3 -o offline_package/weights/cxr_densenet18.ts https://huggingface.co/arammoostafaye/bone-suppression-desktop/resolve/main/weights/cxr_densenet18.ts
          Get-ChildItem offline_package/weights | ForEach-Object { Write-Host ("{0} {1} bytes" -f $_.Name, $_.Length) }
          if ((Get-Item offline_package/weights/bone_suppression.ts).Length -lt 400000000) { throw "bone weights incomplete" }
          if ((Get-Item offline_package/weights/lung_component_suppression.ts).Length -lt 400000000) { throw "lung weights incomplete" }
          if ((Get-Item offline_package/weights/fracture_yolov8.onnx).Length -lt 10000000) { throw "fracture weights incomplete" }
          if ((Get-Item offline_package/weights/cxr_densenet18.ts).Length -lt 25000000) { throw "pathology weights incomplete" }

      - name: Build with PyInstaller (package flags, verbatim)
        run: |
          cd offline_package
          # single line: the workflow shell is pwsh, where ^ is not a continuation
          pyinstaller --noconfirm --onedir --windowed --name "BoneSuppressionAI" --add-data "weights;weights" --add-data "config.json;." --collect-all torch --collect-all cv2 BoneSuppression_Desktop.py
          if (Test-Path "apply_update.bat") {
              Copy-Item "apply_update.bat" "dist\BoneSuppressionAI\" -Force
          }

      - name: Verify bundle + model smoke test
        run: |
          $ErrorActionPreference = "Stop"
          $d = "offline_package\dist\BoneSuppressionAI"
          $i = "$d\_internal"
          if (-not (Test-Path "$d\BoneSuppressionAI.exe")) { throw "exe missing" }
          if (-not (Test-Path "$i\weights\bone_suppression.ts")) { throw "bone weights not bundled" }
          if (-not (Test-Path "$i\weights\lung_component_suppression.ts")) { throw "lung weights not bundled" }
          if (-not (Test-Path "$i\weights\fracture_yolov8.onnx")) { throw "fracture weights not bundled" }
          if (-not (Test-Path "$i\weights\cxr_densenet18.ts")) { throw "pathology weights not bundled" }
          if (-not (Get-ChildItem $i -Recurse -Filter "tcl86t.dll" -ErrorAction SilentlyContinue)) { throw "tcl/tk runtime missing (tkinter UI would not start)" }
          python -c "import sys; sys.path.insert(0,'offline_package'); import BoneSuppression_Desktop; print('APP IMPORT OK')"
          python -c "import sys; sys.path.insert(0,'offline_package'); import BoneSuppression_Desktop as b; app = b.BoneSuppressionApp(); app.update(); print('APP UI INITIALIZED OK')"
          @'
          import torch, cv2, numpy as np
          # 1. Test Bone Suppression
          b = torch.jit.load("offline_package/weights/bone_suppression.ts", map_location="cpu").eval()
          l = torch.jit.load("offline_package/weights/lung_component_suppression.ts", map_location="cpu").eval()
          x = torch.rand(1, 1, 1024, 1024)
          with torch.no_grad():
              bo = b(x); bo = bo[0] if isinstance(bo, (list, tuple)) else bo
              soft = x - bo
              lu = l(soft); lu = lu[0] if isinstance(lu, (list, tuple)) else lu
          print("MODEL 1 (BONE SUPPRESSION) OK", tuple(bo.shape), tuple(lu.shape))

          # 2. Test Fracture YOLOv8
          fnet = cv2.dnn.readNetFromONNX("offline_package/weights/fracture_yolov8.onnx")
          blob = cv2.dnn.blobFromImage(np.zeros((640,640,3), dtype=np.uint8), 1/255.0, (640,640))
          fnet.setInput(blob)
          fout = fnet.forward()
          print("MODEL 2 (FRACTURE YOLOv8) OK", fout.shape)

          # 3. Test 18 Pathologies DenseNet-121
          pnet = torch.jit.load("offline_package/weights/cxr_densenet18.ts", map_location="cpu").eval()
          px = torch.rand(1, 1, 224, 224)
          with torch.no_grad():
              pout = pnet(px)
          print("MODEL 3 (18 PATHOLOGIES DENSENET) OK", pout.shape)
          '@ | Set-Content probe.py
          python probe.py

      - name: Pack zip and tar.gz
        run: |
          cd offline_package/dist
          tar -czf ../../BoneSuppressionAI-offline.tar.gz BoneSuppressionAI
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
              # 1. Full offline package (with all weights, ~1000 MB)
              7z a -tzip -mx=4 ../../BoneSuppressionAI-Windows-x64-Offline.zip BoneSuppressionAI
              
              # 2. Lightweight update package (EXCLUDING ONLY the heavy 835 MB bone & lung models => ~280 MB!)
              # Use temporary folder to guarantee clean exclusion regardless of 7z flags:
              New-Item -ItemType Directory -Path "../patch_temp" -Force
              Copy-Item -Path "BoneSuppressionAI" -Destination "../patch_temp/BoneSuppressionAI" -Recurse
              Remove-Item -Path "../patch_temp/BoneSuppressionAI/_internal/weights/bone_suppression.ts" -Force -ErrorAction SilentlyContinue
              Remove-Item -Path "../patch_temp/BoneSuppressionAI/_internal/weights/lung_component_suppression.ts" -Force -ErrorAction SilentlyContinue
              7z a -tzip -mx=4 ../../BoneSuppressionAI-v2.4.1-Update-Only.zip ../patch_temp/BoneSuppressionAI
              Remove-Item -Path "../patch_temp" -Recurse -Force
          } else {
              Compress-Archive -Path BoneSuppressionAI -DestinationPath ../../BoneSuppressionAI-Windows-x64-Offline.zip -Force
          }
          cd ../..
          certutil -hashfile BoneSuppressionAI-offline.tar.gz SHA256
          certutil -hashfile BoneSuppressionAI-Windows-x64-Offline.zip SHA256
          if (Test-Path "BoneSuppressionAI-v2.4.1-Update-Only.zip") {
              certutil -hashfile BoneSuppressionAI-v2.4.1-Update-Only.zip SHA256
              Get-Item BoneSuppressionAI-v2.4.1-Update-Only.zip | ForEach-Object { Write-Host ("{0} {1} bytes" -f $_.Name, $_.Length) }
          }
          Get-Item BoneSuppressionAI-offline.tar.gz | ForEach-Object { Write-Host ("{0} {1} bytes" -f $_.Name, $_.Length) }
          Get-Item BoneSuppressionAI-Windows-x64-Offline.zip | ForEach-Object { Write-Host ("{0} {1} bytes" -f $_.Name, $_.Length) }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoneSuppressionAI-offline
          path: |
            BoneSuppressionAI-offline.tar.gz
            BoneSuppressionAI-Windows-x64-Offline.zip
            BoneSuppressionAI-v2.4.1-Update-Only.zip

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BoneSuppressionAI-Windows-x64-Offline.zip
            BoneSuppressionAI-v2.4.1-Update-Only.zip
            BoneSuppressionAI-offline.tar.gz
            offline_package/update_patch.bat
            offline_package/apply_update.bat
