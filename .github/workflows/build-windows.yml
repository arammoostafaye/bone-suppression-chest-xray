name: Build Windows exe

# Easiest trigger: repo -> Actions -> "Build Windows exe" -> Run workflow.
# Also runs when something the desktop build depends on changes, and on v* tags
# (which additionally publish a Release).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "app_codespaces.py"
      - ".devcontainer/requirements-codespaces.txt"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach the zip to a Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheel index first: skips ~2.5 GB of CUDA libraries that a desktop
      # build without an NVIDIA GPU would never load.
      - name: Install torch (CPU)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install app + packaging deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .devcontainer/requirements-codespaces.txt
          # tzdata: Linux build env has a system zoneinfo, Windows does not
          python -m pip install pyinstaller pywebview tzdata

      # Cheap gate before the slow packaging step: catches a broken dependency
      # set in ~20 s instead of after a 20-minute PyInstaller run.
      - name: Smoke-test imports
        run: >
          python -c "import torch, gradio, cv2, numpy, PIL, spaces, webview;
          print('torch', torch.__version__);
          print('gradio', gradio.__version__);
          print('cv2', cv2.__version__);
          print('cuda available:', torch.cuda.is_available())"

      - name: Build with PyInstaller
        run: pyinstaller desktop/bone_suppression.spec --noconfirm --clean

      # Single-file build: one standalone .exe the user can double-click with
      # no zip and no manual extraction (self-extracts to %TEMP% at launch).
      - name: Build onefile exe
        run: pyinstaller desktop/bone_suppression_onefile.spec --noconfirm

      - name: Boot-test the frozen exes (headless Windows)
        env:
          BSP_HEADLESS: "1"
        run: |
          $ErrorActionPreference = "Stop"
          function Wait-Ui([int]$port, [int]$minutes, $proc) {
            $deadline = (Get-Date).AddMinutes($minutes)
            while ((Get-Date) -lt $deadline) {
              if ($proc -and $proc.HasExited) { throw "exe exited early (code $($proc.ExitCode))" }
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:$port/"
                if ($r.StatusCode -eq 200) { return $r }
              } catch { }
              Start-Sleep -Seconds 5
            }
            throw "no UI on port $port within $minutes min"
          }
          # --- onefile: the exact single file users double-click
          $env:BSP_PORT = "7861"
          $p1 = Start-Process -FilePath "dist\BoneSuppression.exe" -PassThru
          try {
            $r = Wait-Ui 7861 12 $p1
            Write-Host "ONEFILE UI: HTTP $($r.StatusCode), $($r.Content.Length) bytes of HTML"
            $c = Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 "http://127.0.0.1:7861/config"
            Write-Host "ONEFILE /config: HTTP $($c.StatusCode), $($c.Content.Length) bytes"
          } finally { taskkill /F /T /PID $p1.Id | Out-Null }
          # --- onedir: the layout inside the zip
          $env:BSP_PORT = "7862"
          $p2 = Start-Process -FilePath "dist\BoneSuppression\BoneSuppression.exe" -PassThru
          try {
            $r = Wait-Ui 7862 8 $p2
            Write-Host "ONEDIR UI: HTTP $($r.StatusCode), $($r.Content.Length) bytes of HTML"
          } finally { taskkill /F /T /PID $p2.Id | Out-Null }
          Write-Host "BOOT TEST PASSED: both frozen exes started and served the UI"

      - name: Report output
        shell: pwsh
        run: |
          $d = "dist/BoneSuppression"
          # PyInstaller 6 puts datas under <name>/_internal, which is also what
          # sys._MEIPASS points to at runtime - that is where run_desktop.py chdir's.
          $i = "$d/_internal"
          if (-not (Test-Path "$d/BoneSuppression.exe")) { throw "exe was not produced" }
          if (-not (Test-Path "$i/examples"))            { throw "examples/ missing from the bundle" }
          if (-not (Test-Path "$i/desktop/icon.png"))    { throw "favicon missing from the bundle" }
          # safehttpx reads this at import time; without it the frozen app
          # dies with FileNotFoundError on the user's machine (seen in the wild).
          if (-not (Test-Path "$i/safehttpx/version.txt")) { throw "safehttpx/version.txt missing from the bundle" }
          # groovy (gradio dep) reads its version.txt at import too - 2nd
          # occurrence of this bug class in the wild; spec now bundles all of them.
          if (-not (Test-Path "$i/groovy/version.txt")) { throw "groovy/version.txt missing from the bundle" }
          # gradio re-reads its own .py sources at import (component_meta);
          # without them the frozen app dies on blocks_events.py (3rd occurrence).
          if (-not (Test-Path "$i/gradio/blocks_events.py")) { throw "gradio/blocks_events.py missing from the bundle" }
          $size = (Get-ChildItem $d -Recurse | Measure-Object -Property Length -Sum).Sum
          "Unpacked size : {0:N0} MB" -f ($size / 1MB)
          "File count    : {0}" -f (Get-ChildItem $d -Recurse -File).Count
          "examples pngs : {0}" -f (Get-ChildItem "$i/examples" -File).Count
          "favicon       : OK"

      # 7-Zip is preinstalled on the GitHub Windows runners and is far faster
      # than Compress-Archive on a ~1 GB tree; fall back if it is missing.
      # Zipping from inside dist/ makes the archive unzip to BoneSuppression/
      # directly instead of dist/BoneSuppression/.
      - name: Zip the build
        shell: pwsh
        run: |
          $out = Join-Path (Get-Location) "BoneSuppression-Windows-x64.zip"
          Push-Location dist
          try {
            if (Get-Command 7z -ErrorAction SilentlyContinue) {
              7z a -tzip -mx=5 $out BoneSuppression
            } else {
              Compress-Archive -Path BoneSuppression -DestinationPath $out
            }
          } finally { Pop-Location }
          "Zip size: {0:N0} MB" -f ((Get-Item $out).Length / 1MB)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoneSuppression-Windows-x64
          path: BoneSuppression-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      # The no-extraction option: a single standalone .exe.
      - name: Upload onefile exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoneSuppression-exe
          path: dist/BoneSuppression.exe
          if-no-files-found: error
          retention-days: 90

      # Only on a version tag: publish the zip as a Release asset so it has a
      # permanent URL (artifacts expire after 90 days).
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BoneSuppression-Windows-x64.zip
          generate_release_notes: true
